name: DevOps CI/CD Pipeline

on:
push:
branches:
- main

env:
AWS_REGION: us-east-1
ECR_REPOSITORY: devops-ecr
ACCOUNT_ID: 141964413005
EKS_CLUSTER_NAME: devops

jobs:
build-and-deploy:
runs-on: ubuntu-latest

```
steps:

- name: Checkout Code
  uses: actions/checkout@v3

- name: Setup Java
  uses: actions/setup-java@v3
  with:
    distribution: temurin
    java-version: '11'

- name: Give permission to mvnw
  run: chmod +x mvnw

- name: Build JAR using Maven
  run: ./mvnw clean package -DskipTests

- name: Configure AWS Credentials
  uses: aws-actions/configure-aws-credentials@v2
  with:
    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    aws-region: ${{ env.AWS_REGION }}

- name: Login to Amazon ECR
  uses: aws-actions/amazon-ecr-login@v1

- name: Build Docker Image
  run: |
    docker build -t $ECR_REPOSITORY .

- name: Tag Docker Image
  run: |
    docker tag $ECR_REPOSITORY:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

- name: Push Docker Image to ECR
  run: |
    docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

- name: Update kubeconfig for EKS
  run: |
    aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

- name: Deploy to Kubernetes
  run: |
    kubectl apply -f k8s/deployment.yaml
    kubectl apply -f k8s/service.yaml
```
