name: Java Maven CI/CD

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-ecr
  EKS_CLUSTER_NAME: devops

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Maven Project
        run: mvn clean package -DskipTests


  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/devops-ecr:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/devops-ecr:latest

      - name: Install kubectl manually
        run: |
          curl -o kubectl https://amazon-eks.s3.us-west-2.amazonaws.com/1.29.0/2024-01-04/bin/linux/amd64/kubectl
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name devops \
            --region us-east-1

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/java-app \
          java-app=${{ steps.login-ecr.outputs.registry }}/devops-ecr:latest

          kubectl rollout status deployment/java-app
